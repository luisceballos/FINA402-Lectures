<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="22" fill="#faf8f5"/><text x="55" y="55" fill="#9b7625" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">ONE BUSINESS. TWO CLAIMS.</text><text x="55" y="92" fill="#18283c" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start">Where does the equity valuation belong?</text><rect x="55" y="140" width="420" height="340" rx="16" fill="#e5ecef"/><rect x="515" y="140" width="300" height="120" rx="16" fill="#d8dce2"/><rect x="515" y="280" width="300" height="200" rx="16" fill="#6B1A2B"/><text x="83" y="185" fill="#18283c" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">ASSETS</text><text x="83" y="230" fill="#18283c" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Cash and working capital</text><text x="83" y="265" fill="#18283c" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Property and equipment</text><text x="83" y="300" fill="#18283c" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Other assets</text><text x="83" y="425" fill="#18283c" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Book assets</text><text x="540" y="185" fill="#18283c" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">LIABILITIES</text><text x="540" y="222" fill="#18283c" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Debt + other obligations</text><text x="540" y="330" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">EQUITY</text><text x="540" y="371" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Shareholder claim</text><text x="540" y="439" fill="#f5e9c8" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Book equity ≠ intrinsic value</text><path d="M 995 325 L 835 365 M 995 425 L 835 385" stroke="#b8962e" stroke-width="4" fill="none"/><path d="M850 353 L835 365 L854 370 M854 377 L835 385 L850 397" stroke="#b8962e" stroke-width="4" fill="none"/><text x="1000" y="307" fill="#6B1A2B" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">FCFE</text><text x="1000" y="337" fill="#18283c" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Cash available</text><text x="1000" y="416" fill="#207A75" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">DDM</text><text x="1000" y="446" fill="#18283c" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Dividends paid</text><text x="55" y="535" fill="#18283c" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Assets = liabilities + book equity</text><text x="55" y="578" fill="#18283c" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Both valuation approaches estimate the intrinsic value of the equity claim, not total assets.</text></svg>
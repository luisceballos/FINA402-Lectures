<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="22" fill="#172b3f"/><text x="55" y="57" fill="#ffb653" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">AMAZON</text><text x="55" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="76" font-weight="700" text-anchor="start">$0</text><text x="55" y="170" fill="#e4ebf0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Cash dividends ever paid</text><line x1="570" y1="70" x2="570" y2="310" stroke="#546577" stroke-width="2"/><text x="635" y="125" fill="#ffb653" font-family="Arial,sans-serif" font-size="65" font-weight="700" text-anchor="start">&gt;$2.1 trillion</text><text x="635" y="170" fill="#e4ebf0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Equity market value</text><text x="55" y="250" fill="#ffffff" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start">Can zero dividends today mean zero value?</text><text x="55" y="300" fill="#e4ebf0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">The valuation question concerns future cash shareholders can receive.</text><text x="55" y="367" fill="#c6d0da" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Value bound: non-affiliate voting shares alone were worth $2.118tn on June 30, 2025.</text><text x="55" y="397" fill="#c6d0da" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Amazon 2025 Form 10-K; dividend history verified against Amazon Investor Relations FAQ.</text></svg>
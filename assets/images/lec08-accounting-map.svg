<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560"><rect width="620" height="560" rx="18" fill="#f7f4f0"/><text x="26" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18283c">Where do the cash-flow items connect?</text><rect x="25" y="75" width="275" height="150" rx="12" fill="#dce8ef"/><text x="38" y="105" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18283c">OPERATING ASSETS</text><text x="38" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18283c">Receivables + inventory</text><text x="38" y="162" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18283c">WC: cash tied up in operations</text><rect x="25" y="245" width="275" height="150" rx="12" fill="#dce8ef"/><text x="38" y="275" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18283c">LONG-TERM ASSETS</text><text x="38" y="307" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18283c">Property, plant &amp; equipment</text><text x="38" y="332" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18283c">CapEx adds; D&amp;A allocates cost</text><rect x="325" y="75" width="270" height="110" rx="12" fill="#e9e1d2"/><text x="338" y="105" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18283c">OPERATING LIABILITIES</text><text x="338" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18283c">Payables fund part of WC</text><rect x="325" y="205" width="270" height="100" rx="12" fill="#d4dce5"/><text x="338" y="235" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18283c">INTEREST-BEARING DEBT</text><text x="338" y="267" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#18283c">New borrowing - principal repaid</text><rect x="325" y="325" width="270" height="125" rx="12" fill="#6b1a2b"/><text x="338" y="355" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">BOOK EQUITY</text><text x="338" y="387" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="white">NI increases retained earnings;</text><text x="338" y="412" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="white">dividends reduce them</text><text x="25" y="478" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18283c">Assets = Liabilities + Book equity</text><text x="25" y="515" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#18283c">Balance sheet = stocks at a date.</text><text x="25" y="542" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#18283c">FCFE = cash flow over a period; not a balance-sheet line.</text></svg>